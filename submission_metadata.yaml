ai_usage_summary: >
  AI tools were used to assist with code generation, debugging, and
  architectural design. All feature engineering logic, recruiter heuristics,
  and ranking methodology were designed by the team.

methodology_summary: >
  SignalHire AI uses a multi-stage retrieval and ranking pipeline to discover
  the top 100 candidates from 100k profiles. Stage 1 performs hybrid retrieval
  using a union of semantic similarity (all-MiniLM-L6-v2 embeddings) and
  lexical BM25 scoring, producing ~10k candidates. Stage 2 extracts 22
  handcrafted recruiter features across 5 dimensions: Technical Fit (retrieval,
  ranking, vector DB, evaluation framework experience), Startup Readiness,
  Candidate Authenticity (career/timeline consistency, synthetic profile
  detection), Hireability (notice period, response rate, recency), and
  Behavioral Reliability (role progression, leadership). Stage 3 uses
  LightGBM LambdaRank trained on deterministic pseudo-labels derived from
  our recruiter scoring formula. The system detects keyword stuffers,
  profile inconsistencies, and honeypot candidates before final ranking.
  Runs entirely offline on CPU within 35 seconds.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
