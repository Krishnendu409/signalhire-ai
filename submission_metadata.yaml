  - "Claude (code generation, debugging, and research assistance)"

ai_usage_summary: >
  Claude (Claude Code) was used as an engineering assistant: auditing the
  existing pipeline, analysing the dataset, researching IR/ranking best
  practices, and pair-writing/refactoring code. All design decisions, feature
  definitions, weights, and honeypot rules were reviewed and validated by the
  team against the real data. No candidate data was sent to any hosted LLM,
  and the ranking step itself makes no network/API calls.

methodology_summary: >
  SignalHire AI uses a multi-stage retrieval and ranking pipeline to discover
  the top 100 candidates from 100k profiles. Stage 1 performs hybrid retrieval:
  precomputed MiniLM dense embeddings (headline + summary + career trajectory)
  fused with a TF-IDF/BM25 lexical score via Reciprocal Rank Fusion (k=60).
  Stage 2 extracts recruiter-aligned features across JD-relative fit
  (title/role, a rare retrieval/vector-DB specialist-skill bonus, semantic
  similarity, seniority), skill AUTHENTICITY (endorsements + months used, not
  raw keyword count), behavioural availability (recruiter response, activity
  recency, open-to-work, notice period), location fit, and
  product-vs-consulting-vs-research signals. Stage 3 combines these into a
  transparent, deterministic weighted score (not a trained model — there is
  no ground-truth relevance data to train against, so a trained ranker's
  scores would be uncalibrated and undefensible). Explicit penalties demote
  off-domain keyword-stuffers and CV/speech-only or research-only profiles. A
  rule-based integrity gate hard-flags impossible "honeypot" profiles (expert
  skills with 0 months used, tenure exceeding career, date/duration
  contradictions), giving 0 honeypots in the top 100. Runs entirely offline,
  CPU-only, no network, in roughly 30-50 seconds over the full 100k pool.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
